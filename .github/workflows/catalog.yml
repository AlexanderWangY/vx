# Distros move and rename their cloud images. Check every built-in image still resolves to a
# download with a published checksum, so a broken URL shows up here before a user hits it.
# Reads only checksum files and directory listings; nothing large is downloaded.
name: Image catalog

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve every image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked catalog_resolves -- --ignored --nocapture
